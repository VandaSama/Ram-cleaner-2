          package com.ramlega.data

          import android.content.Context
          import androidx.datastore.preferences.core.edit
          import androidx.datastore.preferences.core.stringSetPreferencesKey
          import androidx.datastore.preferences.preferencesDataStore
          import kotlinx.coroutines.flow.Flow
          import kotlinx.coroutines.flow.map

          private val Context.exclusionStore by preferencesDataStore(name = "ram_lega")

          /** Satu-satunya sumber data Daftar Pengecualian (dipakai UI dan widget). */
          class ExclusionRepository(context: Context) {
              private val store = context.applicationContext.exclusionStore
              private val key = stringSetPreferencesKey("excluded_packages")

              val excluded: Flow<Set<String>> = store.data.map { it[key] ?: emptySet() }

              suspend fun setExcluded(pkg: String, on: Boolean) {
                  store.edit { prefs ->
                      val set = (prefs[key] ?: emptySet()).toMutableSet()
                      if (on) set.add(pkg) else set.remove(pkg)
                      prefs[key] = set
                  }
              }
          }
          __END__

      - name: Buat berkas proyek (4/10)
        run: |
          mkdir -p "$(dirname "app/src/main/java/com/ramlega/domain/CleanRamUseCase.kt")"
          cat > "app/src/main/java/com/ramlega/domain/CleanRamUseCase.kt" <<'__END__'
          package com.ramlega.domain

          import android.app.ActivityManager
          import android.content.Context
          import android.content.pm.ApplicationInfo
          import com.ramlega.data.ExclusionRepository
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.ensureActive
          import kotlinx.coroutines.flow.first
          import kotlinx.coroutines.withContext

          data class RamInfo(val totalMb: Long, val freeMb: Long) {
              val freePercent: Int get() = if (totalMb == 0L) 0 else (freeMb * 100 / totalMb).toInt()
          }

          data class CleanResult(
              val before: RamInfo,
              val after: RamInfo,
              val appsProcessed: Int,
              val rounds: Int,
              val denied: Boolean,
          ) {
              val freedMb: Long get() = (after.freeMb - before.freeMb).coerceAtLeast(0)
          }

          /** Dipakai bersama oleh UI (ViewModel) dan widget. */
          class CleanRamUseCase(context: Context) {
              private val ctx = context.applicationContext
              private val am = ctx.getSystemService(ActivityManager::class.java)
              private val repo = ExclusionRepository(ctx)

              fun ramInfo(): RamInfo {
                  val mi = ActivityManager.MemoryInfo()
                  am.getMemoryInfo(mi)
                  return RamInfo(mi.totalMem shr 20, mi.availMem shr 20)
              }

              /** Aplikasi yang boleh dihentikan (di luar pengecualian dan sistem penting). */
              suspend fun targets(): List<ApplicationInfo> = withContext(Dispatchers.Default) {
                  val excluded = repo.excluded.first() + ProtectedApps.automatic(ctx)
                  val pm = ctx.packageManager
                  pm.getInstalledApplications(0).filter {
                      it.enabled &&
                          it.packageName !in excluded &&
                          it.flags and ApplicationInfo.FLAG_STOPPED == 0 &&
                          ProtectedApps.isKillable(pm, it)
                  }
              }

              /** Hentikan satu aplikasi. false bila sistem menolak izin. */
              fun kill(pkg: String): Boolean = try {
                  am.killBackgroundProcesses(pkg)
                  true
              } catch (e: SecurityException) {
                  false
              } catch (e: Exception) {
                  true
              }

              suspend operator fun invoke(onProgress: (Float) -> Unit = {}): CleanResult =
                  withContext(Dispatchers.Default) {
                      val before = ramInfo()
                      val apps = targets()
                      val active = estimateActive(apps)

                      var best = before.freeMb
                      var rounds = 0
                      var denied = false
                      for (round in 1..MAX_ROUNDS) {
                          rounds = round
                          for ((i, app) in apps.withIndex()) {
                              ensureActive()
                              if (!kill(app.packageName)) {
                                  denied = true
                                  break
                              }
                              onProgress(((round - 1) + (i + 1f) / apps.size) / MAX_ROUNDS)
                          }
                          if (denied) break
                          delay(PAUSE_MS)
                          val free = ramInfo().freeMb
                          val gain = free - best
                          best = maxOf(best, free)
                          if (round >= 2 && gain < MIN_GAIN_MB) break
                      }
                      onProgress(1f)
                      CleanResult(before, ramInfo(), active, rounds, denied)
                  }

              /** Perkiraan: dengan izin Usage Access, hanya hitung aplikasi yang aktif 12 jam terakhir. */
              private fun estimateActive(apps: List<ApplicationInfo>): Int {
                  if (!UsageAccess.isGranted(ctx)) return apps.size
                  val recent = UsageAccess.lastUsed(ctx, 12 * 3_600_000L).keys
                  return apps.count { it.packageName in recent }
              }

              private companion object {
                  const val MAX_ROUNDS = 3
                  const val PAUSE_MS = 500L
                  const val MIN_GAIN_MB = 10L
              }
          }
          __END__

      - name: Buat berkas proyek (5/10)
        run: |
          mkdir -p "$(dirname "app/src/main/java/com/ramlega/domain/ProtectedApps.kt")"
          cat > "app/src/main/java/com/ramlega/domain/ProtectedApps.kt" <<'__END__'
          package com.ramlega.domain

          import android.content.Context
          import android.content.Intent
          import android.content.pm.ApplicationInfo
          import android.content.pm.PackageManager
          import android.provider.Settings

          object ProtectedApps {
              /** Awalan paket sistem/vendor penting yang tidak pernah disentuh. */
              private val CRITICAL_PREFIXES = listOf(
                  "com.google.android.gms", "com.google.android.gsf", "com.google.android.webview",
                  "com.google.android.permissioncontroller", "com.google.android.providers",
                  "com.google.android.ext", "com.android.systemui", "com.android.phone",
                  "com.android.settings", "com.android.providers", "com.android.inputmethod",
                  "com.samsung.android.", "com.sec.android.", "com.miui.", "com.xiaomi.",
                  "com.huawei.", "com.coloros.", "com.oplus.", "com.vivo.",
              )

              /** Pengecualian otomatis: semua launcher, keyboard aktif, dan aplikasi ini sendiri. */
              fun automatic(context: Context): Set<String> {
                  val pm = context.packageManager
                  val home = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_HOME)
                  val launchers = pm.queryIntentActivities(home, 0).map { it.activityInfo.packageName }
                  val ime = Settings.Secure
                      .getString(context.contentResolver, Settings.Secure.DEFAULT_INPUT_METHOD)
                      ?.substringBefore('/')
                  return (launchers + listOfNotNull(ime, context.packageName)).toSet() - "android"
              }

              /** Aplikasi biasa boleh; aplikasi sistem hanya jika sudah diperbarui user dan punya ikon peluncur. */
              fun isKillable(pm: PackageManager, app: ApplicationInfo): Boolean {
                  val pkg = app.packageName
                  if (CRITICAL_PREFIXES.any { pkg.startsWith(it) }) return false
                  val system = app.flags and ApplicationInfo.FLAG_SYSTEM != 0
                  val updated = app.flags and ApplicationInfo.FLAG_UPDATED_SYSTEM_APP != 0
                  return !system || (updated && pm.getLaunchIntentForPackage(pkg) != null)
              }
          }
          __END__
          mkdir -p "$(dirname "app/src/main/java/com/ramlega/domain/UsageAccess.kt")"
          cat > "app/src/main/java/com/ramlega/domain/UsageAccess.kt" <<'__END__'
          package com.ramlega.domain

          import android.app.AppOpsManager
          import android.app.usage.UsageStatsManager
          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import android.os.Process
          import android.provider.Settings

          object UsageAccess {
              @Suppress("DEPRECATION")
              fun isGranted(ctx: Context): Boolean {
                  val ops = ctx.getSystemService(AppOpsManager::class.java)
                  val mode = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      ops.unsafeCheckOpNoThrow(AppOpsManager.OPSTR_GET_USAGE_STATS, Process.myUid(), ctx.packageName)
                  } else {
                      ops.checkOpNoThrow(AppOpsManager.OPSTR_GET_USAGE_STATS, Process.myUid(), ctx.packageName)
                  }
                  return mode == AppOpsManager.MODE_ALLOWED
              }

              fun settingsIntent(): Intent =
                  Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)

              /** Paket -> waktu terakhir dipakai (ms) dalam [withinMs] terakhir. Kosong bila izin belum diberikan. */
              fun lastUsed(ctx: Context, withinMs: Long): Map<String, Long> {
                  if (!isGranted(ctx)) return emptyMap()
                  return try {
                      val usm = ctx.getSystemService(UsageStatsManager::class.java)
                      val now = System.currentTimeMillis()
                      val since = now - withinMs
                      usm.queryUsageStats(UsageStatsManager.INTERVAL_DAILY, since, now).orEmpty()
                          .filter { it.lastTimeUsed >= since }
                          .groupBy { it.packageName }
                          .mapValues { e -> e.value.maxOf { it.lastTimeUsed } }
                  } catch (e: Exception) {
                      emptyMap()
                  }
              }
          }
          __END__

