          @Composable
          fun RamLegaTheme(content: @Composable () -> Unit) {
              val dark = isSystemInDarkTheme()
              val ctx = LocalContext.current
              val scheme = when {
                  // Material You hanya ada di Android 12+; Android 10 memakai warna statis.
                  Build.VERSION.SDK_INT >= Build.VERSION_CODES.S ->
                      if (dark) dynamicDarkColorScheme(ctx) else dynamicLightColorScheme(ctx)
                  dark -> darkColorScheme(primary = Color(0xFF5BD8A0))
                  else -> lightColorScheme(primary = Color(0xFF1E8E5A))
              }
              MaterialTheme(colorScheme = scheme, content = content)
