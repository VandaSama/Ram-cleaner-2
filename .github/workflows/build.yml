          private enum class Screen { Home, Active, Exclusions, Usage }

          @Composable
          fun App(onClose: (MainViewModel) -> Unit) {
              var screen by remember { mutableStateOf(Screen.Home) }
              BackHandler(enabled = screen != Screen.Home) { screen = Screen.Home }
              Surface(Modifier.fillMaxSize()) {
                  when (screen) {
                      Screen.Home -> HomeScreen(
                          onActive = { screen = Screen.Active },
                          onExclusions = { screen = Screen.Exclusions },
                          onUsage = { screen = Screen.Usage },
                          onClose = onClose,
                      )
                      Screen.Active -> ActiveAppsScreen(onBack = { screen = Screen.Home })
                      Screen.Exclusions -> ExclusionsScreen(onBack = { screen = Screen.Home })
