          @Composable
          private fun HomeScreen(
              onActive: () -> Unit,
              onExclusions: () -> Unit,
              onUsage: () -> Unit,
              onClose: (MainViewModel) -> Unit,
              vm: MainViewModel = viewModel(),
          ) {
              val s by vm.state.collectAsStateWithLifecycle()
              LifecycleEventEffect(Lifecycle.Event.ON_RESUME) { vm.refresh() }

              val target = if (s.running) s.progress else s.ram.freePercent / 100f
              val ring by animateFloatAsState(target, tween(600), label = "ring")

              Column(Modifier.fillMaxSize().systemBarsPadding().padding(horizontal = 24.dp, vertical = 8.dp)) {
                  Row(
                      Modifier.fillMaxWidth(),
                      verticalAlignment = Alignment.CenterVertically,
                      horizontalArrangement = Arrangement.SpaceBetween,
                  ) {
                      Text("RAM Lega", style = MaterialTheme.typography.headlineMedium)
                      TextButton(onClick = { onClose(vm) }) { Text("Tutup \u2715") }
                  }

                  Column(
                      Modifier.weight(1f).fillMaxWidth().verticalScroll(rememberScrollState()),
                      horizontalAlignment = Alignment.CenterHorizontally,
                      verticalArrangement = Arrangement.spacedBy(16.dp),
