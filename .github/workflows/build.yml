              </group>
          </vector>
          __END__
          mkdir -p "$(dirname "app/src/main/res/drawable/widget_bg.xml")"
          cat > "app/src/main/res/drawable/widget_bg.xml" <<'__END__'
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
