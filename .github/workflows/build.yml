                  }
                  OutlinedTextField(
                      value = query,
                      onValueChange = vm::setQuery,
                      label = { Text("Cari aplikasi") },
                      singleLine = true,
                      modifier = Modifier.fillMaxWidth().padding(horizontal = 16.dp),
                  )
                  LazyColumn(Modifier.fillMaxSize()) {
                      items(apps, key = { it.pkg }) { app ->
                          AppRow(app, checked = app.locked || app.pkg in excluded) { vm.toggle(app.pkg, it) }
                      }
                  }
              }
          }

          @Composable
          private fun AppIcon(pkg: String) {
              val ctx = LocalContext.current
              val icon = remember(pkg) {
                  runCatching { ctx.packageManager.getApplicationIcon(pkg).toBitmap(96, 96).asImageBitmap() }.getOrNull()
              }
              if (icon != null) Image(bitmap = icon, contentDescription = null, modifier = Modifier.size(40.dp))
              else Spacer(Modifier.size(40.dp))
          }

          @Composable
          private fun AppRow(app: AppItem, checked: Boolean, onChange: (Boolean) -> Unit) {
              Row(
                  Modifier.fillMaxWidth().padding(horizontal = 16.dp, vertical = 8.dp),
                  verticalAlignment = Alignment.CenterVertically,
              ) {
                  AppIcon(app.pkg)
                  Column(Modifier.weight(1f).padding(horizontal = 12.dp)) {
                      Text(app.label, maxLines = 1, overflow = TextOverflow.Ellipsis)
