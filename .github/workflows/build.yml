          package com.ramlega.ui

          import android.app.Application
          import androidx.lifecycle.AndroidViewModel
          import androidx.lifecycle.viewModelScope
          import com.ramlega.domain.CleanRamUseCase
          import com.ramlega.domain.UsageAccess
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.asStateFlow
          import kotlinx.coroutines.launch

          data class ActiveApp(val pkg: String, val label: String, val lastUsed: Long?)

          class ActiveAppsViewModel(app: Application) : AndroidViewModel(app) {
              private val useCase = CleanRamUseCase(app)
              private val _apps = MutableStateFlow<List<ActiveApp>>(emptyList())
              private val _loading = MutableStateFlow(true)

              val apps: StateFlow<List<ActiveApp>> = _apps.asStateFlow()
              val loading: StateFlow<Boolean> = _loading.asStateFlow()

              /** Urut dari yang terakhir dipakai. Bila izin Usage Access ada, hanya yang dipakai 24 jam terakhir. */
              fun load() {
                  viewModelScope.launch(Dispatchers.Default) {
                      _loading.value = true
                      val application = getApplication<Application>()
                      val pm = application.packageManager
                      val used = UsageAccess.lastUsed(application, 24 * 3_600_000L)
                      val list = useCase.targets()
                          .map { ActiveApp(it.packageName, it.loadLabel(pm).toString(), used[it.packageName]) }
                          .filter { used.isEmpty() || it.lastUsed != null }
                          .sortedWith(compareByDescending<ActiveApp> { it.lastUsed ?: 0L }.thenBy { it.label.lowercase() })
                      _apps.value = list
                      _loading.value = false
                  }
              }

              fun kill(pkg: String) {
                  viewModelScope.launch(Dispatchers.Default) { useCase.kill(pkg) }
              }
          }
          __END__
