                  TextButton(onClick = onBack) { Text("< Kembali") }
                  Text("Akses Penggunaan (opsional)", style = MaterialTheme.typography.titleLarge)
                  Text(
                      "Android tidak memberi tahu aplikasi mana yang sedang berjalan. Dengan izin ini, " +
                          "RAM Lega memakainya untuk memperkirakan aplikasi yang aktif dalam 12-24 jam " +
                          "terakhir dan mengurutkan daftar Aplikasi aktif. Data tidak disimpan dan tidak " +
