          cat > "app/src/main/java/com/ramlega/ui/MainViewModel.kt" <<'__END__'
          package com.ramlega.ui

          import android.app.Application
          import androidx.lifecycle.AndroidViewModel
          import androidx.lifecycle.viewModelScope
          import com.ramlega.domain.CleanRamUseCase
          import com.ramlega.domain.CleanResult
          import com.ramlega.domain.RamInfo
          import com.ramlega.domain.UsageAccess
          import kotlinx.coroutines.cancelChildren
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.asStateFlow
          import kotlinx.coroutines.flow.update
          import kotlinx.coroutines.launch

          data class MainUiState(
              val ram: RamInfo = RamInfo(0, 0),
              val running: Boolean = false,
              val progress: Float = 0f,
              val result: CleanResult? = null,
              val usageGranted: Boolean = false,
          )

          class MainViewModel(app: Application) : AndroidViewModel(app) {
              private val useCase = CleanRamUseCase(app)
              private val _state = MutableStateFlow(MainUiState())
              val state: StateFlow<MainUiState> = _state.asStateFlow()

              init { refresh() }

              fun refresh() = _state.update {
                  it.copy(
                      ram = useCase.ramInfo(),
                      usageGranted = UsageAccess.isGranted(getApplication<Application>()),
                  )
              }

              fun clean() {
                  if (_state.value.running) return
                  _state.update { it.copy(running = true, progress = 0f, result = null) }
                  viewModelScope.launch {
                      val result = useCase(onProgress = { p -> _state.update { s -> s.copy(progress = p) } })
                      _state.update { it.copy(running = false, progress = 1f, result = result, ram = result.after) }
                  }
              }

              /** Dipanggil sebelum aplikasi menutup total. */
              fun cancelAll() {
                  viewModelScope.coroutineContext.cancelChildren()
              }
          }
          __END__

