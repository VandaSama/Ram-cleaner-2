                          onClick = vm::clean,
                          enabled = !s.running,
                          modifier = Modifier.fillMaxWidth().height(56.dp),
                      ) { Text(if (s.result == null) "Bersihkan" else "Bersihkan lagi") }

                      OutlinedButton(onClick = onActive, enabled = !s.running, modifier = Modifier.fillMaxWidth()) {
                          Text("Aplikasi aktif")
                      }
                      OutlinedButton(onClick = onExclusions, enabled = !s.running, modifier = Modifier.fillMaxWidth()) {
                          Text("Daftar Pengecualian")
