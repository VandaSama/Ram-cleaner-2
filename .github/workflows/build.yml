          package com.ramlega

          import android.app.Activity
          import android.os.Bundle
          import android.os.Process
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import com.ramlega.ui.App
          import com.ramlega.ui.RamLegaTheme

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      RamLegaTheme {
                          // Hanya menutup saat tombol "Tutup" di kanan atas ditekan.
                          App(onClose = { vm ->
                              vm.cancelAll()      // batalkan semua coroutine
                              closeCompletely()   // tutup task + matikan proses
                          })
                      }
                  }
              }

              override fun onStart() {
                  super.onStart()
                  visible = true
              }

              override fun onStop() {
                  visible = false
                  super.onStop()
              }

              companion object {
                  /** Dibaca widget: jangan matikan proses bila layar aplikasi sedang terbuka. */
                  @Volatile
                  var visible = false
              }
          }

          /** Menutup total supaya aplikasi tidak menempati RAM. */
          fun Activity.closeCompletely() {
              finishAndRemoveTask()
              Process.killProcess(Process.myPid())
          }
          __END__
