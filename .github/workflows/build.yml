                  TextButton(onClick = onForce) { Text("Paksa") }
              }
          }

          private fun ago(t: Long?): String {
              if (t == null) return "Tidak ada data pemakaian"
              val m = (System.currentTimeMillis() - t) / 60_000
              return when {
                  m < 1 -> "Baru saja dipakai"
                  m < 60 -> "Dipakai $m menit lalu"
                  else -> "Dipakai ${m / 60} jam lalu"
              }
          }

          private fun openAppInfo(ctx: Context, pkg: String) {
              try {
                  ctx.startActivity(
                      Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:$pkg"))
                          .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  )
              } catch (e: Exception) {
                  Toast.makeText(ctx, "Tidak bisa membuka info aplikasi", Toast.LENGTH_SHORT).show()
              }
          }

          /** Layar "Layanan berjalan" di Opsi Pengembang menampilkan RAM tiap aplikasi (angka asli dari sistem). */
          private fun openRunningServices(ctx: Context) {
              val tries = listOf(
                  Intent().setClassName("com.android.settings", "com.android.settings.Settings\$DevRunningServicesActivity"),
                  Intent(Settings.ACTION_APPLICATION_DEVELOPMENT_SETTINGS),
              )
              for (i in tries) {
                  try {
                      ctx.startActivity(i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                      return
                  } catch (e: Exception) {
                      // coba cara berikutnya
                  }
              }
              Toast.makeText(
                  ctx,
                  "Aktifkan Opsi Pengembang: Pengaturan > Tentang ponsel > ketuk Nomor build 7 kali",
                  Toast.LENGTH_LONG,
              ).show()
          }

