name: Build RAM Lega APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Buat berkas proyek (1/10)
        run: |
          mkdir -p "$(dirname ".gitignore")"
          cat > ".gitignore" <<'__END__'
          .gradle/
          build/
          local.properties
          *.iml
          .idea/
          __END__
          mkdir -p "$(dirname "README.md")"
          cat > "README.md" <<'__END__'
          # RAM Lega

          Pembersih RAM sekali ketuk (Kotlin, Jetpack Compose, Material 3). minSdk 26, target 36, jalan di Android 10.

          ## Build lewat GitHub (tanpa PC)
          1. Buat repositori di github.com, unggah isi proyek ini (atau pakai `build.yml` satu-file yang menghasilkan proyek ini sendiri).
          2. Tab Actions -> "Build RAM Lega APK" jalan otomatis, tunggu hijau (sekitar 5-10 menit).
          3. Unduh `RAM-Lega.apk` dari Releases (atau Artifacts), instal, izinkan "sumber tidak dikenal".

          ## Struktur
          - `data/ExclusionRepository` - DataStore, satu sumber daftar pengecualian (UI dan widget)
          - `domain/CleanRamUseCase` - logika bersih-bersih, dipakai UI dan widget
          - `domain/ProtectedApps` - launcher, keyboard aktif, aplikasi sendiri, dan sistem penting
          - `ui/` - MainViewModel, ExclusionsViewModel, layar Compose
          - `widget/CleanWidgetProvider` - widget 1x1 (BroadcastReceiver + goAsync)

          ## Keterbatasan (jujur)
          - Sejak Android 5.1 aplikasi tidak bisa melihat proses aplikasi lain. Jadi `killBackgroundProcesses` dipanggil ke semua aplikasi terpasang yang lolos saringan; "jumlah aplikasi diproses" hanya perkiraan.
          - Hanya proses latar belakang yang bisa dihentikan. Aplikasi di layar, layanan foreground, dan aplikasi sistem inti tidak tersentuh; aplikasi dengan layanan sticky/alarm bisa hidup lagi.
          - Android sudah menghitung memori cache sebagai "tersedia", jadi kenaikan RAM bebas bisa kecil atau nol. Aplikasi yang dimatikan dibuka lebih lambat dan bisa lebih boros baterai.
          - Beberapa merek (MIUI, One UI, ColorOS) punya pembatasan tambahan.
          - Aplikasi tidak menutup sendiri: gunakan tombol Tutup di kanan atas. Widget mematikan prosesnya setelah Toast (sekitar 2 detik), kecuali layar aplikasi sedang terbuka.
          - Android 10 tidak mengizinkan aplikasi biasa membaca RAM aplikasi lain (hanya sistem/ADB). Angka MB per aplikasi tersedia di Opsi Pengembang > Layanan berjalan; layar Aplikasi aktif hanya menampilkan urutan terakhir dipakai.
          - Aplikasi dengan layanan foreground/notifikasi tetap (misalnya yang terus berjalan) tidak bisa dimatikan dengan killBackgroundProcesses. Gunakan tombol Paksa lalu Paksa berhenti di info aplikasi.
          - APK debug bertanda tangan debug; Play Protect bisa memberi peringatan. QUERY_ALL_PACKAGES dibatasi Google Play, tetapi aman untuk instal manual.
          __END__
          mkdir -p "$(dirname "app/build.gradle.kts")"
          cat > "app/build.gradle.kts" <<'__END__'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.ramlega"
              compileSdk = 36

              defaultConfig {
                  applicationId = "com.ramlega"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 1
                  versionName = "1.0"
              }

              // Kunci debug tetap: APK hasil build berikutnya bisa menimpa (update) tanpa copot dulu.
              signingConfigs {
                  getByName("debug") {
                      storeFile = file("debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                      storeType = "pkcs12"
                  }
              }

              buildTypes {
                  release { isMinifyEnabled = false }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              buildFeatures { compose = true }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2025.04.01"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.10.1")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.7")
              implementation("androidx.datastore:datastore-preferences:1.1.1")
              implementation("androidx.core:core-ktx:1.15.0")
          }
          __END__

