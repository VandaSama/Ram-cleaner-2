          @Composable
          private fun ActiveAppsScreen(onBack: () -> Unit, vm: ActiveAppsViewModel = viewModel()) {
              val ctx = LocalContext.current
              val apps by vm.apps.collectAsStateWithLifecycle()
              val loading by vm.loading.collectAsStateWithLifecycle()
              var stopped by remember { mutableStateOf(setOf<String>()) }
              LaunchedEffect(Unit) { vm.load() }

              Column(Modifier.fillMaxSize().systemBarsPadding()) {
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      TextButton(onClick = onBack) { Text("< Kembali") }
                      Text("Aplikasi aktif", style = MaterialTheme.typography.titleLarge)
                  }
                  Text(
                      "Android 10 tidak mengizinkan aplikasi biasa membaca RAM aplikasi lain, jadi angka MB " +
                          "tidak bisa ditampilkan di sini. Daftar ini diurutkan dari yang terakhir dipakai " +
                          "(butuh Akses Penggunaan). \"Hentikan\" mematikan proses latar belakang; untuk yang " +
