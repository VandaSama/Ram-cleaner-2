                  OutlinedButton(
                      onClick = { openRunningServices(ctx) },
                      modifier = Modifier.fillMaxWidth().padding(horizontal = 16.dp, vertical = 8.dp),
                  ) { Text("Lihat RAM per aplikasi (bawaan sistem)") }

                  if (loading) {
                      Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) { CircularProgressIndicator() }
                  } else {
                      LazyColumn(Modifier.fillMaxSize()) {
                          items(apps, key = { it.pkg }) { a ->
                              ActiveRow(
                                  app = a,
                                  stopped = a.pkg in stopped,
                                  onStop = { vm.kill(a.pkg); stopped = stopped + a.pkg },
                                  onForce = { openAppInfo(ctx, a.pkg) },
                              )
                          }
                      }
                  }
              }
          }

          @Composable
          private fun ActiveRow(app: ActiveApp, stopped: Boolean, onStop: () -> Unit, onForce: () -> Unit) {
