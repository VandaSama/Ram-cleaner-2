          @Composable
          private fun UsageScreen(onBack: () -> Unit) {
              val ctx = LocalContext.current
              Column(
                  Modifier.fillMaxSize().systemBarsPadding().padding(24.dp),
                  verticalArrangement = Arrangement.spacedBy(16.dp),
