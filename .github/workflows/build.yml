                          Card(Modifier.fillMaxWidth()) {
                              Column(Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(6.dp)) {
                                  Text("Sebelum: ${r.before.freeMb} MB (${r.before.freePercent}%)")
                                  Text("Sesudah: ${r.after.freeMb} MB (${r.after.freePercent}%)")
                                  Text("Dibebaskan: ${r.freedMb} MB", fontWeight = FontWeight.Bold)
                                  Text("Aplikasi diproses: ${r.appsProcessed} (perkiraan), ${r.rounds} putaran")
                                  if (r.denied) {
                                      Text("Sistem menolak izin menghentikan proses.", color = MaterialTheme.colorScheme.error)
                                  }
                              }
