          package com.ramlega.ui

          import android.app.Application
          import androidx.lifecycle.AndroidViewModel
          import androidx.lifecycle.viewModelScope
          import com.ramlega.data.ExclusionRepository
          import com.ramlega.domain.ProtectedApps
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.SharingStarted
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.combine
          import kotlinx.coroutines.flow.stateIn
          import kotlinx.coroutines.launch

          data class AppItem(val pkg: String, val label: String, val locked: Boolean)

          class ExclusionsViewModel(app: Application) : AndroidViewModel(app) {
              private val repo = ExclusionRepository(app)
              private val locked = ProtectedApps.automatic(app)
              private val all = MutableStateFlow<List<AppItem>>(emptyList())
              private val _query = MutableStateFlow("")

              val query: StateFlow<String> = _query
              val excluded: StateFlow<Set<String>> =
                  repo.excluded.stateIn(viewModelScope, SharingStarted.Eagerly, emptySet())
              val apps: StateFlow<List<AppItem>> = combine(all, _query) { list, q ->
                  if (q.isBlank()) list
                  else list.filter { it.label.contains(q, true) || it.pkg.contains(q, true) }
              }.stateIn(viewModelScope, SharingStarted.Eagerly, emptyList())

              init {
                  viewModelScope.launch(Dispatchers.Default) {
                      val pm = app.packageManager
                      all.value = pm.getInstalledApplications(0)
                          .map { AppItem(it.packageName, it.loadLabel(pm).toString(), it.packageName in locked) }
                          .sortedBy { it.label.lowercase() }
                  }
              }

              fun setQuery(q: String) { _query.value = q }

              fun toggle(pkg: String, on: Boolean) {
                  viewModelScope.launch { repo.setExcluded(pkg, on) }
              }
          }
          __END__

