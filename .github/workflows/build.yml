          mkdir -p "$(dirname "app/src/main/java/com/ramlega/widget/CleanWidgetProvider.kt")"
          cat > "app/src/main/java/com/ramlega/widget/CleanWidgetProvider.kt" <<'__END__'
          package com.ramlega.widget

          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.Context
          import android.content.Intent
          import android.os.Process
          import android.widget.RemoteViews
          import android.widget.Toast
          import com.ramlega.MainActivity
          import com.ramlega.R
          import com.ramlega.domain.CleanRamUseCase
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.SupervisorJob
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext

          class CleanWidgetProvider : AppWidgetProvider() {

              override fun onUpdate(context: Context, manager: AppWidgetManager, ids: IntArray) {
                  val intent = Intent(context, CleanWidgetProvider::class.java).setAction(ACTION_CLEAN)
                  val pi = PendingIntent.getBroadcast(
                      context, 0, intent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE,
                  )
                  for (id in ids) {
                      val views = RemoteViews(context.packageName, R.layout.widget)
                      views.setOnClickPendingIntent(R.id.btn, pi)
                      manager.updateAppWidget(id, views)
                  }
              }

              override fun onReceive(context: Context, intent: Intent) {
                  super.onReceive(context, intent) // meneruskan APPWIDGET_UPDATE ke onUpdate
                  if (intent.action != ACTION_CLEAN) return

                  val pending = goAsync()
                  val app = context.applicationContext
                  CoroutineScope(SupervisorJob() + Dispatchers.Default).launch {
                      try {
                          val r = CleanRamUseCase(app)()
                          withContext(Dispatchers.Main) {
                              Toast.makeText(app, "${r.freedMb} MB dibebaskan", Toast.LENGTH_SHORT).show()
                          }
                          delay(2200) // beri waktu Toast tampil sebelum proses berakhir
                      } catch (e: Exception) {
                          // jangan crash dari widget
                      } finally {
                          pending.finish()
                          // Jangan matikan proses bila layar aplikasi sedang terbuka.
                          if (!MainActivity.visible) Process.killProcess(Process.myPid())
                      }
                  }
              }

              companion object {
                  const val ACTION_CLEAN = "com.ramlega.action.CLEAN"
              }
          }
          __END__
          mkdir -p "$(dirname "app/src/main/res/drawable/ic_broom.xml")"
          cat > "app/src/main/res/drawable/ic_broom.xml" <<'__END__'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M11,2h2v9h-2z M7,11h10l3,11H4z" />
          </vector>
          __END__
          mkdir -p "$(dirname "app/src/main/res/drawable/ic_launcher_fg.xml")"
          cat > "app/src/main/res/drawable/ic_launcher_fg.xml" <<'__END__'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <group
                  android:scaleX="2.2"
                  android:scaleY="2.2"
                  android:translateX="27.6"
                  android:translateY="27.6">
                  <path
                      android:fillColor="#FFFFFF"
                      android:pathData="M11,2h2v9h-2z M7,11h10l3,11H4z" />
              </group>
          </vector>
          __END__
          mkdir -p "$(dirname "app/src/main/res/drawable/widget_bg.xml")"
          cat > "app/src/main/res/drawable/widget_bg.xml" <<'__END__'
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="oval">
              <solid android:color="#1E8E5A" />
          </shape>
          __END__

      - name: Buat berkas proyek (10/10)
        run: |
          mkdir -p "$(dirname "app/src/main/res/layout/widget.xml")"
          cat > "app/src/main/res/layout/widget.xml" <<'__END__'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:padding="4dp">

              <ImageView
                  android:id="@+id/btn"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:background="@drawable/widget_bg"
                  android:contentDescription="@string/app_name"
                  android:padding="14dp"
                  android:src="@drawable/ic_broom" />
          </FrameLayout>
          __END__
          mkdir -p "$(dirname "app/src/main/res/mipmap-anydpi/ic_launcher.xml")"
          cat > "app/src/main/res/mipmap-anydpi/ic_launcher.xml" <<'__END__'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_bg" />
              <foreground android:drawable="@drawable/ic_launcher_fg" />
          </adaptive-icon>
          __END__
          mkdir -p "$(dirname "app/src/main/res/values/colors.xml")"
          cat > "app/src/main/res/values/colors.xml" <<'__END__'
          <resources>
              <color name="ic_bg">#1E8E5A</color>
          </resources>
          __END__
          mkdir -p "$(dirname "app/src/main/res/values/strings.xml")"
          cat > "app/src/main/res/values/strings.xml" <<'__END__'
          <resources>
              <string name="app_name">RAM Lega</string>
          </resources>
          __END__
          mkdir -p "$(dirname "app/src/main/res/values/themes.xml")"
          cat > "app/src/main/res/values/themes.xml" <<'__END__'
          <resources>
              <style name="Theme.RamLega" parent="android:Theme.Material.Light.NoActionBar" />
          </resources>
          __END__
          mkdir -p "$(dirname "app/src/main/res/xml-v31/widget_info.xml")"
          cat > "app/src/main/res/xml-v31/widget_info.xml" <<'__END__'
          <?xml version="1.0" encoding="utf-8"?>
          <!-- Android 12+: targetCellWidth/Height hanya dikenali API 31+. -->
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:initialLayout="@layout/widget"
              android:minHeight="40dp"
              android:minWidth="40dp"
              android:resizeMode="none"
              android:targetCellHeight="1"
              android:targetCellWidth="1"
              android:updatePeriodMillis="0"
              android:widgetCategory="home_screen" />
          __END__
          mkdir -p "$(dirname "app/src/main/res/xml/widget_info.xml")"
          cat > "app/src/main/res/xml/widget_info.xml" <<'__END__'
          <?xml version="1.0" encoding="utf-8"?>
          <!-- Android 10-11: ukuran dasar 1x1 sel. -->
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:initialLayout="@layout/widget"
              android:minHeight="40dp"
              android:minWidth="40dp"
              android:resizeMode="none"
              android:updatePeriodMillis="0"
              android:widgetCategory="home_screen" />
          __END__
          mkdir -p "$(dirname "build.gradle.kts")"
          cat > "build.gradle.kts" <<'__END__'
          plugins {
              id("com.android.application") version "8.9.1" apply false
              id("org.jetbrains.kotlin.android") version "2.1.20" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.1.20" apply false
          }
          __END__
          mkdir -p "$(dirname "gradle.properties")"
          cat > "gradle.properties" <<'__END__'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.suppressUnsupportedCompileSdk=36
          kotlin.code.style=official
          __END__
          mkdir -p "$(dirname "settings.gradle.kts")"
          cat > "settings.gradle.kts" <<'__END__'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "RamLega"
          include(":app")
          __END__

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Android SDK (bawaan runner)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;35.0.0" || echo "lanjut, Gradle akan mengunduh sendiri"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Siapkan APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RAM-Lega.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RAM-Lega-apk
          path: RAM-Lega.apk

      - name: Publikasikan ke Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: RAM Lega (terbaru)
          files: RAM-Lega.apk
          make_latest: true
