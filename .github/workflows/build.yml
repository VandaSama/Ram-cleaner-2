      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Pasang platform Android 36
        run: sdkmanager --install "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Siapkan APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RAM-Lega.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RAM-Lega-apk
          path: RAM-Lega.apk

      - name: Publikasikan ke Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: RAM Lega (terbaru)
          files: RAM-Lega.apk
          make_latest: true

